apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # -------------------------------------------------------------
  # 1. THE SERVICE: Set up a Slack/Webhook integration destination
  # -------------------------------------------------------------
  service.slack: |
    token: $argocd-notifications-secret:webhook-url

  # -------------------------------------------------------------
  # 2. THE TEMPLATE: Design what the failure alert looks like
  # -------------------------------------------------------------
  template.app-sync-failed: |
    message: |
      🚨 *ArgoCD Deployment Failed!*
      *Application:* {{ .app.metadata.name }}
      *Reason:* The sync operation failed.
      *Current Health:* {{ .app.status.health.status }}
      *Repository:* {{ .app.spec.source.repoURL }}
      *Target Revision:* {{ .app.spec.source.targetRevision }}
    slack:
      attachments: |
        [{
          "title": "Open ArgoCD Dashboard",
          "title_link": "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}",
          "color": "#FF0000"
        }]

  # -------------------------------------------------------------
  # 3. THE TRIGGER: Bind the template to a sync failure state
  # -------------------------------------------------------------
  trigger.on-sync-failed: |
    - description: Application syncing has failed
      send: [app-sync-failed] # Calls the template we defined above
      when: app.status.sync.status == 'Failed'

  trigger.on-status-unknown: |
    - when: app.status.sync.status == 'Unknown'
      send: [slack-webhook-template]
      
  # -------------------------------------------------------------
  # Catch Upstream Helm & Manifest Generation Crashes
  # -------------------------------------------------------------
  trigger.on-rendering-error: |
    - description: Application manifest generation or chart pulling failed
      send: [app-sync-failed] # Points to your existing Slack template
      when: any(app.status.conditions, {.type == 'ComparisonError'}) # 👈 Tracks the exact condition array