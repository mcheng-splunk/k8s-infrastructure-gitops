apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # 1. REGISTER AS A WEBHOOK ROUTE instead of service.slack
  service.webhook.app-sync-failed: |
    url: $argocd-notifications-secret:webhook-url

  # -------------------------------------------------------------
  # 2. THE TEMPLATE: (Kept exactly as you designed it)
  # -------------------------------------------------------------
  template.app-sync-failed: |
    message: |
      🚨 *ArgoCD Deployment Failed!*
      *Application:* {{ .app.metadata.name }}
      *Reason:* The deployment or manifest compilation failed.
      *Current Health:* {{ .app.status.health.status }}
      *Repository:* {{ .app.spec.source.repoURL }}
      *Target Revision:* {{ .app.spec.source.targetRevision }}
    slack:
      attachments: |
        [{
          "title": "Open ArgoCD Dashboard",
          "title_link": "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}",
          "color": "#FF0000"
        }]

  # -------------------------------------------------------------
  # 3. THE TRIGGERS: (All pointing cleanly to the app-sync-failed destination)
  # -------------------------------------------------------------
  trigger.on-sync-failed: |
    - description: Application syncing has failed
      send: [app-sync-failed] 
      when: app.status.sync.status == 'Failed'

  trigger.on-status-unknown: |
    - description: Sync state is blocked/stuck
      send: [app-sync-failed] # 👈 FIXED: Pointing to your valid template name
      when: app.status.sync.status == 'Unknown'
      
  trigger.on-rendering-error: |
    - description: Application manifest generation or chart pulling failed
      send: [app-sync-failed] 
      when: any(app.status.conditions, {.type == 'ComparisonError'})