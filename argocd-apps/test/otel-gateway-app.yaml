apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-otel-gateway
  namespace: argocd
spec:
  project: default
  destination:
    server: https://52.74.160.179:6443
    namespace: monitoring-test
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.153.0
      helm:
        releaseName: test-otel-gateway
        valueFiles:
          - $gitea-values/apps/opentelemetry/gateway/base-gateway.yaml
          - $gitea-values/apps/opentelemetry/gateway/test-values.yaml
    - repoURL: https://github.com/mcheng-splunk/k8s-infrastructure-gitops.git
      targetRevision: main
      ref: gitea-values
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true