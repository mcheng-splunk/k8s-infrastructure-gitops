apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-otel-agent
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc # Change if Prod is on an isolated cluster
    namespace: monitoring-prod
  sources:
    - repoURL: https://github.com/open-telemetry/opentelemetry-helm-charts/releases/download/opentelemetry-collector-0.157.2
      chart: open-telemetry-collector
      targetRevision: 0.157.2
      helm:
        releaseName: prod-otel
        valueFiles:
          - $gitea-values/apps/opentelemetry/agent/base-agent.yaml
          - $gitea-values/apps/opentelemetry/agent/prod-values.yaml
    - repoURL: http://192.168.20.192:3000/melvincheng/k8s-infrastructure-gitops.git
      targetRevision: main
      ref: gitea-values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true