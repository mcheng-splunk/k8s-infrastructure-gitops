apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-otel-gateway
  namespace: argocd
spec:
  project: default
  destination:
    server: https://52.74.235.129:6443
    namespace: monitoring-dev
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: open-telemetry-collector
      targetRevision: 0.157.0
      helm:
        releaseName: dev-otel-gateway
        valueFiles:
          - $gitea-values/apps/opentelemetry/gateway/base-gateway.yaml
          - $gitea-values/apps/opentelemetry/gateway/dev-values.yaml
    - repoURL: https://github.com/mcheng-splunk/k8s-infrastructure-gitops.git
      targetRevision: main
      ref: gitea-values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true