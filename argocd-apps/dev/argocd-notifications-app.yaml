apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-notifications
  namespace: argocd # Keeps it in the main system controller space
spec:
  project: default
  source:
    repoURL: 'https://github.com/mcheng-splunk/k8s-infrastructure-gitops.git'
    targetRevision: HEAD
    path: core/argocd-notifications # Points straight to your new directory
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd # Deploys directly into the core argocd engine namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true