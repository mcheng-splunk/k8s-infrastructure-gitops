mode: daemonset

image:
  repository: otel/opentelemetry-collector-k8s

presets:
  logsCollection:
    enabled: true
  hostMetrics:
    enabled: true

config:
# 1. Explicitly enable the health check extension
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  exporters:
    otlp:
      # Automatically routes to the local gateway service in the same namespace
      endpoint: '{{ .Release.Name }}-gateway-collector:4317'
      tls:
        insecure: true
    debug:
      verbosity: detailed

  processors:
    batch:
      timeout: 1s

  service:
    pipelines:
      metrics:
        receivers: [hostmetrics, otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp, debug]
      logs:
        receivers: [filelog, otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp, debug]