mode: deployment

image:
  repository: otel/opentelemetry-collector-k8s
  
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 1s

  # Change this to your preferred upstream observability vendor/backend
  exporters:
    otlp:
      endpoint: "your-observability-backend:4317" 
      tls:
        insecure: true
    debug:
      logLevel: debug

  service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp, debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp]