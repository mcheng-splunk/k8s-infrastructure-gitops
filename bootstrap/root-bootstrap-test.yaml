apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-bootstrap-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mcheng-splunk/k8s-infrastructure-gitops.git
    targetRevision: main
    path: argocd-apps/test  
  destination:
    server: https://52.74.160.179:6443 # Deploys directly to the local cluster it runs on
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true